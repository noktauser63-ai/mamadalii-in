plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.toastdemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.toastdemo'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
